
services:
  mysql:
    image: mysql:8.4
    container_name: jardineria_mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: jardineria
      MYSQL_USER: jardineria_user
      MYSQL_PASSWORD: jardin123

    ports:
      - "3306:3306"

    volumes:
      - jardineria_data:/var/lib/mysql
      - ./database/init:/docker-entrypoint-initdb.d:ro

volumes:
  jardineria_data:
